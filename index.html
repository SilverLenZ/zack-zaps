<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SilverLenz ⚡ Zaps</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

<style>
body {
  background: radial-gradient(circle at top, #111 0%, #000 100%);
  color: #f1f1f1;
  font-family: system-ui, sans-serif;
}

.zap-row {
  border: 2px solid rgba(251,191,36,0.18);
  transition: all 0.2s ease;
}

.zap-row:hover {
  transform: translateY(-2px);
  border-color: rgba(251,191,36,0.5);
  background: rgba(251,191,36,0.06);
}

/* glow tiers */
.low { box-shadow: 0 0 10px rgba(251,191,36,0.08); }
.mid { box-shadow: 0 0 16px rgba(251,191,36,0.12); }
.high { box-shadow: 0 0 24px rgba(251,191,36,0.18); }
.legend { box-shadow: 0 0 35px rgba(251,191,36,0.28); }

/* QR box fixed size */
.qr-box {
  width: 60px;
  height: 60px;
  background: white;
  border-radius: 8px;
  padding: 4px;
  flex-shrink: 0;
}

/* ensure sats NEVER get covered */
.sats {
  min-width: 110px;
  text-align: right;
}
</style>
</head>

<body class="min-h-screen flex flex-col items-center p-6 md:p-12">

<!-- HEADER -->
<div class="max-w-3xl w-full text-center mb-6">

  <h1 class="text-4xl font-light tracking-widest">SILVERLENZ</h1>

  <p class="text-amber-300 mt-2 text-sm">
    Living Lightning Art Economy ⚡
  </p>

  <div id="weblnStatus" class="text-xs mt-2 opacity-70"></div>

</div>

<!-- WALLET -->
<div class="max-w-3xl w-full bg-zinc-900/90 border border-amber-400/20 rounded-3xl p-7 shadow-2xl mb-10">

  <div class="flex justify-between items-center mb-5">
    <code class="text-amber-400 text-base">silverlenz@rizful.com</code>

    <button onclick="copyAddress()"
            class="bg-amber-600 hover:bg-amber-500 px-4 py-2 rounded-xl text-xs">
      Copy
    </button>
  </div>

  <p id="status" class="text-xs text-center text-gray-400">
    Ready to receive zaps ⚡
  </p>
</div>

<!-- ZAPS -->
<div class="max-w-3xl w-full space-y-3 mb-16">

  <!-- ROW TEMPLATE -->

  <div class="zap-row low flex items-center justify-between bg-zinc-800 p-4 rounded-2xl">
    <button onclick="zap(1440,this)" class="flex-1 flex items-center gap-2 text-left">
      👍 Perfect Harmony
    </button>
    <span class="sats text-amber-300 font-bold">144 sats</span>
    <div id="qr1440" class="qr-box ml-4"></div>
  </div>

  <div class="zap-row mid flex items-center justify-between bg-zinc-800 p-4 rounded-2xl">
    <button onclick="zap(2330,this)" class="flex-1 flex items-center gap-2 text-left">
      🚀 Artistic Flow
    </button>
    <span class="sats text-amber-300 font-bold">233 sats</span>
    <div id="qr2330" class="qr-box ml-4"></div>
  </div>

  <div class="zap-row mid flex items-center justify-between bg-zinc-800 p-4 rounded-2xl">
    <button onclick="zap(3770,this)" class="flex-1 flex items-center gap-2 text-left">
      ✨ Divine Proportion
    </button>
    <span class="sats text-amber-300 font-bold">377 sats</span>
    <div id="qr3770" class="qr-box ml-4"></div>
  </div>

  <div class="zap-row high flex items-center justify-between bg-zinc-800 p-4 rounded-2xl">
    <button onclick="zap(6100,this)" class="flex-1 flex items-center gap-2 text-left">
      🌀 Spiral Energy
    </button>
    <span class="sats text-amber-300 font-bold">610 sats</span>
    <div id="qr6100" class="qr-box ml-4"></div>
  </div>

  <div class="zap-row high flex items-center justify-between bg-zinc-800 p-4 rounded-2xl">
    <button onclick="zap(9870,this)" class="flex-1 flex items-center gap-2 text-left">
      🍷 Golden Spiral
    </button>
    <span class="sats text-amber-300 font-bold">987 sats</span>
    <div id="qr9870" class="qr-box ml-4"></div>
  </div>

  <div class="zap-row legend flex items-center justify-between bg-zinc-800 p-4 rounded-2xl">
    <button onclick="zap(15970,this)" class="flex-1 flex items-center gap-2 text-left">
      👑 Ultimate Fibonacci
    </button>
    <span class="sats text-amber-300 font-bold">1597 sats</span>
    <div id="qr15970" class="qr-box ml-4"></div>
  </div>

</div>

<!-- FACEBOOK -->
<div class="w-full flex justify-center mb-16">
  <div class="max-w-[1100px] w-full text-center">

    <h2 class="text-xl font-light mb-5 text-amber-300">
      Live Art Pipeline Feed
    </h2>

    <div id="fb-root"></div>

    <div class="fb-page"
      data-href="https://www.facebook.com/covellz/"
      data-tabs="timeline"
      data-width="450"
      data-height="750"
      data-adapt-container-width="true"
      data-hide-cover="false"
      data-show-facepile="true">
    </div>

  </div>
</div>

<script>
const LN = "silverlenz@rizful.com";

/* ZAP FLOW */
async function zap(sats, btn){
  const msats = sats * 1000;
  const [name, domain] = LN.split("@");

  const lnurl = `https://${domain}/.well-known/lnurlp/${name}`;
  const res = await fetch(lnurl);
  const data = await res.json();

  const inv = await fetch(`${data.callback}?amount=${msats}`);
  const invoice = await inv.json();

  const a = document.createElement("a");
  a.href = "lightning:" + invoice.pr;
  document.body.appendChild(a);
  a.click();
  a.remove();

  confetti({ particleCount: 80, spread: 60 });
}

/* COPY */
function copyAddress(){
  navigator.clipboard.writeText(LN);
  setStatus("Copied ✔");
}

function setStatus(t){
  document.getElementById("status").innerText = t;
}

/* WEBLN */
window.onload = () => {
  const el = document.getElementById("weblnStatus");
  if(window.webln){
    el.innerText = "⚡ Alby WebLN detected";
  }

  generateQRs();
};

/* QR GENERATION (FIXED POSITION SAFE) */
function generateQRs(){
  const satsList = [1440,2330,3770,6100,9870,15970];
  const [name, domain] = LN.split("@");

  const base = `https://${domain}/.well-known/lnurlp/${name}`;

  satsList.forEach(async (sats) => {
    const msats = sats * 1000;

    try {
      const res = await fetch(base);
      const data = await res.json();

      const inv = await fetch(`${data.callback}?amount=${msats}`);
      const invoice = await inv.json();

      new QRCode(document.getElementById("qr"+sats), {
        text: "lightning:" + invoice.pr,
        width: 60,
        height: 60
      });

    } catch(e){
      console.log("QR error", e);
    }
  });
}

/* FACEBOOK FIX */
window.fbAsyncInit = function() {
  FB.init({ xfbml: true, version: 'v18.0' });
  FB.XFBML.parse();
};

(function(d,s,id){
  var js,fjs=d.getElementsByTagName(s)[0];
  if(d.getElementById(id))return;
  js=d.createElement(s);js.id=id;
  js.src="https://connect.facebook.net/en_US/sdk.js";
  fjs.parentNode.insertBefore(js,fjs);
}(document,'script','facebook-jssdk'));
</script>

</body>
</html>
