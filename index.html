<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zaps ⚡ | SilverLenz Art Pipeline</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      background: #0a0a0a;
      color: #f1f1f1;
      font-family: system-ui, sans-serif;
    }

    .preset-row {
      transition: 0.2s ease;
      padding: 1.25rem 1.75rem;
      border-radius: 1.5rem;
    }

    .preset-row:hover {
      transform: translateY(-2px);
      background: rgba(251,191,36,0.08);
    }

    .post-card {
      transition: 0.2s ease;
    }

    .post-card:hover {
      transform: translateY(-2px);
    }
  </style>
</head>

<body class="min-h-screen flex flex-col items-center p-6 md:p-12">

<div class="max-w-3xl w-full">

  <!-- HEADER -->
  <div class="flex items-center gap-5 mb-10 justify-center">
    <img src="https://raw.githubusercontent.com/SilverLenZ/zack-zaps/main/silverlenz%20logo.jpg"
         class="w-20 h-20 rounded-2xl border border-amber-400/50">

    <div>
      <h1 class="text-5xl font-light tracking-widest">ZACK COVELL</h1>
      <p class="text-amber-300 text-xl -mt-1">SilverLenz • Fibonacci Art Pipeline</p>
    </div>
  </div>

  <h2 class="text-center text-4xl font-light mb-4 tracking-wider">
    ZAPS THAT RESONATE ⚡
  </h2>

  <p class="text-center text-amber-300 mb-10 text-lg">
    Support the daily art pipeline
  </p>

  <!-- LIGHTNING CARD -->
  <div class="bg-zinc-900/90 border border-amber-400/20 rounded-3xl p-8 shadow-2xl mb-16">

    <p class="uppercase text-xs tracking-widest text-amber-300 mb-3">
      LIGHTNING ADDRESS
    </p>

    <div class="flex items-center justify-between bg-black/60 rounded-2xl p-5 mb-8">
      <code class="font-mono text-2xl text-amber-400">
        silverlenz@rizful.com
      </code>

      <button onclick="copyAddress()"
              class="bg-amber-600 hover:bg-amber-500 px-6 py-3 rounded-2xl">
        Copy
      </button>
    </div>

    <!-- PRESETS -->
    <p class="uppercase text-xs tracking-widest text-amber-300 mb-5">
      GLOBAL ZAP PRESETS
    </p>

    <div class="space-y-4 mb-10" id="presets"></div>

  </div>

  <!-- NOSTR STYLE FEED -->
  <h3 class="text-center text-2xl font-light mb-6 text-amber-300">
    ART POSTS (Nostr Style Feed)
  </h3>

  <div id="feed" class="space-y-6 mb-16"></div>

  <!-- FACEBOOK -->
  <div class="mb-16">
    <div id="fb-root"></div>
    <div class="fb-page"
         data-href="https://www.facebook.com/covellz/"
         data-tabs="timeline"
         data-width="1000"
         data-height="700"
         data-small-header="false"
         data-adapt-container-width="true">
    </div>
  </div>

</div>

<script>
const LN_ADDRESS = "silverlenz@rizful.com";

/* -------------------------
   GLOBAL ZAP PRESETS
--------------------------*/
const presets = [
  { sats: 1440, name: "Perfect Harmony ♫", emoji: "👍" },
  { sats: 2330, name: "Artistic Flow 🌀", emoji: "🚀" },
  { sats: 3770, name: "Divine Proportion △", emoji: "☕" },
  { sats: 6100, name: "Spiral Energy 🌀", emoji: "✨" },
  { sats: 9870, name: "Golden Spiral ✨", emoji: "🍷" },
  { sats: 15970, name: "Ultimate Fibonacci ✨", emoji: "👑" }
];

/* -------------------------
   NOSTR STYLE POSTS
--------------------------*/
const posts = [
  { id: "art-001", title: "Perfect Harmony", sats: 1440, emoji: "🎼" },
  { id: "art-002", title: "Artistic Flow", sats: 2330, emoji: "🌀" },
  { id: "art-003", title: "Golden Spiral", sats: 9870, emoji: "✨" }
];

/* -------------------------
   RENDER PRESETS
--------------------------*/
function renderPresets() {
  document.getElementById("presets").innerHTML =
    presets.map(p => `
      <button onclick="zap(${p.sats})"
              class="preset-row w-full flex items-center gap-6 bg-zinc-800 text-left">
        ${p.emoji}
        <span class="text-3xl font-bold w-24">${p.sats.toLocaleString()}</span>
        <span class="flex-1">${p.name}</span>
      </button>
    `).join("");
}

/* -------------------------
   RENDER POSTS (NOSTR FEED)
--------------------------*/
function renderFeed() {
  document.getElementById("feed").innerHTML =
    posts.map(p => `
      <div class="post-card bg-zinc-900 border border-amber-400/20 rounded-3xl p-6">

        <div class="flex justify-between items-center">
          <div>
            <h2 class="text-2xl font-light">${p.emoji} ${p.title}</h2>
            <p class="text-xs text-amber-300 mt-1">Post ID: ${p.id}</p>
          </div>

          <button onclick="zap(${p.sats})"
                  class="bg-amber-600 hover:bg-amber-500 px-5 py-3 rounded-2xl">
            ⚡ Zap ${p.sats}
          </button>
        </div>

      </div>
    `).join("");
}

/* -------------------------
   CORE ZAP LOGIC (REAL LNURL FLOW)
--------------------------*/
async function zap(sats) {
  try {
    const msats = sats * 1000;

    const [name, domain] = LN_ADDRESS.split("@");
    const lnurl = `https://${domain}/.well-known/lnurlp/${name}`;

    const res = await fetch(lnurl);
    const data = await res.json();

    const invoiceRes = await fetch(`${data.callback}?amount=${msats}`);
    const invoice = await invoiceRes.json();

    if (!invoice.pr) {
      alert("Invoice failed");
      return;
    }

    if (window.webln) {
      await window.webln.enable();
      await window.webln.sendPayment(invoice.pr);
      return;
    }

    window.location.href = `lightning:${invoice.pr}`;

  } catch (e) {
    console.error(e);
    alert("Zap failed");
  }
}

/* -------------------------
   COPY ADDRESS
--------------------------*/
function copyAddress() {
  navigator.clipboard.writeText(LN_ADDRESS);
  const btn = event.target;
  const old = btn.textContent;
  btn.textContent = "Copied!";
  setTimeout(() => btn.textContent = old, 1500);
}

/* -------------------------
   INIT
--------------------------*/
renderPresets();
renderFeed();

/* Facebook SDK */
!(function(d,s,id){
  var js,fjs=d.getElementsByTagName(s)[0];
  if(d.getElementById(id))return;
  js=d.createElement(s);js.id=id;
  js.src="https://connect.facebook.net/en_US/sdk.js#xfbml=1&version=v18.0";
  fjs.parentNode.insertBefore(js,fjs);
}(document,'script','facebook-jssdk'));

</script>

</body>
</html>
