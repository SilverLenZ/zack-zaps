<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SilverLenz ⚡ Zaps</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      background: radial-gradient(circle at top, #111 0%, #000 100%);
      color: #f1f1f1;
      font-family: system-ui, sans-serif;
    }

    .zap-btn {
      transition: all 0.2s ease;
      border: 1px solid rgba(251,191,36,0.15);
    }

    .zap-btn:hover {
      transform: translateY(-2px);
      border-color: rgba(251,191,36,0.5);
      background: rgba(251,191,36,0.08);
    }

    .status {
      transition: all 0.3s ease;
    }

    .glow {
      box-shadow: 0 0 30px rgba(251,191,36,0.2);
    }
  </style>
</head>

<body class="min-h-screen flex flex-col items-center p-6 md:p-12">

<div class="max-w-3xl w-full">

  <!-- HEADER -->
  <div class="text-center mb-10">
    <h1 class="text-5xl font-light tracking-widest">SILVERLENZ</h1>
    <p class="text-amber-300 mt-2">Fibonacci Art Pipeline ⚡ Lightning Zaps</p>
  </div>

  <!-- ADDRESS CARD -->
  <div class="bg-zinc-900/90 border border-amber-400/20 rounded-3xl p-8 shadow-2xl mb-10 glow">

    <p class="uppercase text-xs tracking-widest text-amber-300 mb-3">
      LIGHTNING ADDRESS
    </p>

    <div class="flex items-center justify-between bg-black/60 rounded-2xl p-5 mb-6">
      <code class="text-amber-400 text-lg">silverlenz@rizful.com</code>

      <button onclick="copyAddress()"
              class="bg-amber-600 hover:bg-amber-500 px-5 py-2 rounded-xl text-sm">
        Copy
      </button>
    </div>

    <p id="status" class="status text-sm text-center text-gray-400">
      Ready to receive zaps ⚡
    </p>
  </div>

  <!-- ZAP BUTTONS -->
  <div class="space-y-4">

    <button class="zap-btn w-full flex justify-between items-center bg-zinc-800 p-5 rounded-2xl"
            onclick="zap(1440)">
      <span>👍 Perfect Harmony</span>
      <span class="text-amber-300 font-bold">1,440 sats</span>
    </button>

    <button class="zap-btn w-full flex justify-between items-center bg-zinc-800 p-5 rounded-2xl"
            onclick="zap(2330)">
      <span>🚀 Artistic Flow</span>
      <span class="text-amber-300 font-bold">2,330 sats</span>
    </button>

    <button class="zap-btn w-full flex justify-between items-center bg-zinc-800 p-5 rounded-2xl"
            onclick="zap(3770)">
      <span>☕ Divine Proportion</span>
      <span class="text-amber-300 font-bold">3,770 sats</span>
    </button>

    <button class="zap-btn w-full flex justify-between items-center bg-zinc-800 p-5 rounded-2xl"
            onclick="zap(6100)">
      <span>✨ Spiral Energy</span>
      <span class="text-amber-300 font-bold">6,100 sats</span>
    </button>

    <button class="zap-btn w-full flex justify-between items-center bg-zinc-800 p-5 rounded-2xl"
            onclick="zap(9870)">
      <span>🍷 Golden Spiral</span>
      <span class="text-amber-300 font-bold">9,870 sats</span>
    </button>

    <button class="zap-btn w-full flex justify-between items-center bg-zinc-800 p-5 rounded-2xl"
            onclick="zap(15970)">
      <span>👑 Ultimate Fibonacci</span>
      <span class="text-amber-300 font-bold">15,970 sats</span>
    </button>

  </div>

</div>

<script>
const LN_ADDRESS = "silverlenz@rizful.com";

function setStatus(msg) {
  document.getElementById("status").innerText = msg;
}

async function zap(sats) {
  try {
    setStatus("Preparing zap ⚡...");

    const msats = sats * 1000;
    const [name, domain] = LN_ADDRESS.split("@");

    const lnurl = `https://${domain}/.well-known/lnurlp/${name}`;

    const res = await fetch(lnurl);
    if (!res.ok) throw new Error("LNURL failed");

    const data = await res.json();

    const invoiceRes = await fetch(`${data.callback}?amount=${msats}`);
    const invoice = await invoiceRes.json();

    if (!invoice.pr) throw new Error("No invoice");

    setStatus("Opening wallet...");

    if (window.webln) {
      await window.webln.enable();
      await window.webln.sendPayment(invoice.pr);
      setStatus("⚡ Zap sent successfully!");
      return;
    }

    window.location.href = `lightning:${invoice.pr}`;
    setStatus("Wallet opened ⚡");

  } catch (e) {
    console.error(e);
    setStatus("Zap failed — wallet may not support this flow");
  }
}

function copyAddress() {
  navigator.clipboard.writeText(LN_ADDRESS);
  setStatus("Address copied ✔");
  setTimeout(() => setStatus("Ready to receive zaps ⚡"), 2000);
}
</script>

</body>
</html>
