<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zaps ⚡ | Support SilverLenz Art Pipeline</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #0a0a0a; color: #f1f1f1; font-family: system-ui, sans-serif; }
    .preset-row { 
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); 
      padding: 1.3rem 1.8rem;
    }
    .preset-row:hover { transform: translateY(-3px); }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center p-6 md:p-12">
  <div class="max-w-3xl w-full">

    <!-- Header -->
    <div class="flex items-center gap-5 mb-10 justify-center">
      <img src="https://raw.githubusercontent.com/SilverLenZ/zack-zaps/main/silverlenz%20logo.jpg" 
           alt="SilverLenz" class="w-20 h-20 rounded-2xl object-cover border border-amber-400/50">
      <div>
        <h1 class="text-5xl font-light tracking-widest">ZACK COVELL</h1>
        <p class="text-amber-300 text-xl -mt-1">SilverLenz • Fibonacci Art Pipeline</p>
      </div>
    </div>

    <h2 class="text-center text-4xl font-light mb-4 tracking-wider">ZAPS THAT RESONATE ⚡</h2>
    <p class="text-center text-amber-300 mb-8 text-lg">Support the daily art pipeline</p>

    <!-- How to Zap + Lightning Address -->
    <div class="bg-amber-900/30 border border-amber-400/30 rounded-3xl p-8 mb-12 text-center">
      <p class="text-amber-300 font-medium mb-4">💡 How to Zap</p>
      <p class="text-sm mb-6">Tap any amount below or copy the Lightning Address</p>
      
      <div class="flex items-center justify-center gap-4 bg-black/60 rounded-2xl p-5">
        <code class="font-mono text-xl text-amber-400">silverlenz@getalby.com</code>
        <button onclick="copyAddress()" 
                class="text-amber-400 hover:text-amber-300 text-sm font-medium underline underline-offset-4">
          Copy
        </button>
      </div>
    </div>

    <!-- Facebook Embed -->
    <div class="mb-16 bg-zinc-900 rounded-3xl overflow-hidden shadow-2xl p-4">
      <iframe src="https://www.facebook.com/plugins/page.php?href=https%3A%2F%2Fwww.facebook.com%2Fcovellz%2F&tabs=timeline&width=500&height=650&small_header=false&adapt_container_width=true&hide_cover=false&show_facepile=true&appId=1032861222423751" 
              width="100%" height="650" style="border:none;overflow:hidden" scrolling="no" frameborder="0" allowfullscreen="true"></iframe>
    </div>

    <!-- Zap Buttons -->
    <div>
      <h3 class="text-3xl font-light text-center mb-8">Choose Your Resonance</h3>
      <div class="space-y-4" id="presets"></div>
    </div>

    <footer class="text-center text-xs opacity-60 mt-16">
      Powered by Nostr & Lightning
    </footer>
  </div>

  <script>
    const lnAddress = "silverlenz@getalby.com";

    function renderPresets() {
      const html = `
        <a href="lightning:${lnAddress}?amount=144000" class="preset-row block w-full flex items-center gap-6 bg-zinc-800 hover:bg-amber-900/70 rounded-3xl text-left">
          👍 <span class="text-3xl font-bold w-16">144</span><span class="flex-1">Perfect Harmony ♫</span>
        </a>
        <a href="lightning:${lnAddress}?amount=233000" class="preset-row block w-full flex items-center gap-6 bg-zinc-800 hover:bg-amber-900/70 rounded-3xl text-left">
          🚀 <span class="text-3xl font-bold w-16">233</span><span class="flex-1">Artistic Flow 🌀</span>
        </a>
        <a href="lightning:${lnAddress}?amount=377000" class="preset-row block w-full flex items-center gap-6 bg-zinc-800 hover:bg-amber-900/70 rounded-3xl text-left">
          ☕ <span class="text-3xl font-bold w-16">377</span><span class="flex-1">Divine Proportion △</span>
        </a>
        <a href="lightning:${lnAddress}?amount=610000" class="preset-row block w-full flex items-center gap-6 bg-zinc-800 hover:bg-amber-900/70 rounded-3xl text-left">
          ✨ <span class="text-3xl font-bold w-16">610</span><span class="flex-1">Spiral Energy 🌀</span>
        </a>
        <a href="lightning:${lnAddress}?amount=987000" class="preset-row block w-full flex items-center gap-6 bg-zinc-800 hover:bg-amber-900/70 rounded-3xl text-left">
          🍷 <span class="text-3xl font-bold w-16">987</span><span class="flex-1">Golden Spiral ✨</span>
        </a>
        <a href="lightning:${lnAddress}?amount=1597000" class="preset-row block w-full flex items-center gap-6 bg-zinc-800 hover:bg-amber-900/70 rounded-3xl text-left">
          👑 <span class="text-3xl font-bold w-16">1597</span><span class="flex-1">Ultimate Fibonacci ✨</span>
        </a>
      `;
      document.getElementById('presets').innerHTML = html;
    }

    function copyAddress() {
      navigator.clipboard.writeText(lnAddress);
      const btn = event.target;
      const original = btn.textContent;
      btn.textContent = "Copied!";
      setTimeout(() => btn.textContent = original, 2000);
    }

    window.onload = renderPresets;
  </script>
</body>
</html>
