<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zaps ⚡ | Support SilverLenz Art Pipeline</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/nostr-zap@latest"></script>
  <script src="https://unpkg.com/nostr-tools/lib/nostr.bundle.js"></script>
  <style>
    body { background: #0a0a0a; color: #f1f1f1; font-family: system-ui, sans-serif; }
    .art-hero img { max-height: 75vh; width: 100%; object-fit: contain; border-radius: 16px; box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.5); }
    .preset-row { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
    .preset-row:hover { transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgb(245 158 11 / 0.3); }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center p-6 md:p-12">
  <div class="max-w-3xl w-full">
    <h1 class="text-5xl font-light text-center mb-2 tracking-widest">ZAPS THAT RESONATE ⚡</h1>
    <p class="text-center text-amber-300 mb-12 text-lg">Latest from the Fibonacci Art Pipeline</p>

    <!-- Dynamic Latest Post -->
    <div id="latest-post" class="mb-16 bg-zinc-900 rounded-3xl overflow-hidden shadow-2xl">
      <div class="p-8 text-center text-lg">Loading your most recent art post...</div>
    </div>

    <!-- Zap Presets -->
    <div>
      <h2 class="text-3xl font-light text-center mb-8">Choose Your Resonance</h2>
      <div class="space-y-5" id="presets"></div>
    </div>

    <footer class="text-center text-xs opacity-60 mt-24">
      Powered by Nostr • Automatically shows your newest post
    </footer>
  </div>

  <script>
    const npub = "npub1qc87690ur36nn5td80c07adf72s0evw6fen60l5ytghgp44awljsxml2ka";
    let pubkey;

    try {
      pubkey = NostrTools.nip19.decode(npub).data;
    } catch (e) {
      console.error("Invalid npub");
    }

    async function loadLatestPost() {
      const pool = new NostrTools.SimplePool();
      const relays = [
        'wss://relay.damus.io', 'wss://relay.primal.net', 
        'wss://nos.lol', 'wss://nostr.wine', 'wss://relay.nostr.band'
      ];

      try {
        const events = await pool.get(relays, {
          kinds: [1],
          authors: [pubkey],
          limit: 1
        });

        const container = document.getElementById('latest-post');
        if (!events.length) {
          container.innerHTML = `<div class="p-12 text-center text-amber-400">No recent posts found.<br><small class="opacity-60">Post something new on Nostr and refresh this page.</small></div>`;
          return;
        }

        const event = events[0];
        const imageMatch = event.content.match(/(https?:\/\/[^\s]+\.(jpg|jpeg|png|gif|webp|webm))/i);
        const imageUrl = imageMatch ? imageMatch[0] : null;

        let html = `
          <div class="art-hero">
            ${imageUrl ? `<img src="${imageUrl}" alt="Latest Art" loading="lazy">` : ''}
            <div class="p-8">
              <p class="text-lg leading-relaxed whitespace-pre-wrap">${event.content}</p>
              <div class="mt-6 text-xs opacity-60">${new Date(event.created_at * 1000).toLocaleString()}</div>
            </div>
          </div>
        `;
        container.innerHTML = html;
      } catch (e) {
        console.error(e);
        document.getElementById('latest-post').innerHTML = `<div class="p-12 text-center text-amber-400">Unable to load latest post.<br><small>Try refreshing in a minute.</small></div>`;
      } finally {
        pool.close(relays);
      }
    }

    function renderPresets() {
      const presetsHTML = `
        <button data-npub="${npub}" class="preset-row w-full flex items-center gap-6 bg-zinc-800 hover:bg-amber-900/70 rounded-3xl p-7 text-left text-xl">
          👍 <span class="text-4xl font-bold">144</span><span class="flex-1">Perfect Harmony ♫</span>
        </button>
        <button data-npub="${npub}" class="preset-row w-full flex items-center gap-6 bg-zinc-800 hover:bg-amber-900/70 rounded-3xl p-7 text-left text-xl">
          🚀 <span class="text-4xl font-bold">233</span><span class="flex-1">Artistic Flow 🌀</span>
        </button>
        <button data-npub="${npub}" class="preset-row w-full flex items-center gap-6 bg-zinc-800 hover:bg-amber-900/70 rounded-3xl p-7 text-left text-xl">
          ☕ <span class="text-4xl font-bold">377</span><span class="flex-1">Divine Proportion △</span>
        </button>
        <button data-npub="${npub}" class="preset-row w-full flex items-center gap-6 bg-zinc-800 hover:bg-amber-900/70 rounded-3xl p-7 text-left text-xl">
          ✨ <span class="text-4xl font-bold">610</span><span class="flex-1">Spiral Energy 🌀</span>
        </button>
        <button data-npub="${npub}" class="preset-row w-full flex items-center gap-6 bg-zinc-800 hover:bg-amber-900/70 rounded-3xl p-7 text-left text-xl">
          🍷 <span class="text-4xl font-bold">987</span><span class="flex-1">Golden Spiral ✨</span>
        </button>
        <button data-npub="${npub}" class="preset-row w-full flex items-center gap-6 bg-zinc-800 hover:bg-amber-900/70 rounded-3xl p-7 text-left text-xl">
          👑 <span class="text-4xl font-bold">1597</span><span class="flex-1">Ultimate Fibonacci ✨</span>
        </button>
      `;
      document.getElementById('presets').innerHTML = presetsHTML;
    }

    window.onload = () => {
      loadLatestPost();
      renderPresets();
    };
  </script>
</body>
</html>
