<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SilverLenz ⚡ Art Pipeline Zaps</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    body {
      background: radial-gradient(circle at top, #111 0%, #000 100%);
      color: #f1f1f1;
      font-family: system-ui, sans-serif;
    }

    .zap-btn {
      transition: 0.2s ease;
      border: 1px solid rgba(251,191,36,0.15);
    }

    .zap-btn:hover {
      transform: translateY(-2px);
      border-color: rgba(251,191,36,0.5);
      background: rgba(251,191,36,0.08);
    }

    .success-glow {
      animation: pulse 0.6s ease;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 rgba(251,191,36,0); }
      50% { box-shadow: 0 0 40px rgba(251,191,36,0.5); }
      100% { box-shadow: 0 0 0 rgba(251,191,36,0); }
    }

    /* FULL WIDTH FACEBOOK FEED */
    .fb-wrap {
      width: 100vw;
      margin-left: calc(-50vw + 50%);
    }

    .fb-inner {
      max-width: 1100px;
      margin: 0 auto;
    }
  </style>
</head>

<body class="min-h-screen flex flex-col items-center p-6 md:p-12">

<div class="max-w-3xl w-full">

  <!-- HEADER -->
  <div class="text-center mb-10">
    <h1 class="text-5xl font-light tracking-widest">SILVERLENZ</h1>
    <p class="text-amber-300 mt-2">Fibonacci Art Pipeline ⚡ Live Zaps</p>
  </div>

  <!-- ADDRESS CARD -->
  <div id="card"
       class="bg-zinc-900/90 border border-amber-400/20 rounded-3xl p-8 shadow-2xl mb-10">

    <div class="flex justify-between items-center mb-6">
      <code class="text-amber-400 text-lg">silverlenz@rizful.com</code>

      <button onclick="copyAddress()"
              class="bg-amber-600 hover:bg-amber-500 px-5 py-2 rounded-xl text-sm">
        Copy
      </button>
    </div>

    <p id="status" class="text-sm text-center text-gray-400">
      Ready to receive zaps ⚡
    </p>
  </div>

  <!-- ZAP BUTTONS -->
  <div class="space-y-4 mb-16">

    <button class="zap-btn w-full flex justify-between items-center bg-zinc-800 p-5 rounded-2xl"
            onclick="zap(1440)">
      <span>👍 Perfect Harmony</span>
      <span class="text-amber-300 font-bold">1,440 sats</span>
    </button>

    <button class="zap-btn w-full flex justify-between items-center bg-zinc-800 p-5 rounded-2xl"
            onclick="zap(2330)">
      <span>🚀 Artistic Flow</span>
      <span class="text-amber-300 font-bold">2,330 sats</span>
    </button>

    <button class="zap-btn w-full flex justify-between items-center bg-zinc-800 p-5 rounded-2xl"
            onclick="zap(3770)">
      <span>☕ Divine Proportion</span>
      <span class="text-amber-300 font-bold">3,770 sats</span>
    </button>

    <button class="zap-btn w-full flex justify-between items-center bg-zinc-800 p-5 rounded-2xl"
            onclick="zap(6100)">
      <span>✨ Spiral Energy</span>
      <span class="text-amber-300 font-bold">6,100 sats</span>
    </button>

    <button class="zap-btn w-full flex justify-between items-center bg-zinc-800 p-5 rounded-2xl"
            onclick="zap(9870)">
      <span>🍷 Golden Spiral</span>
      <span class="text-amber-300 font-bold">9,870 sats</span>
    </button>

    <button class="zap-btn w-full flex justify-between items-center bg-zinc-800 p-5 rounded-2xl"
            onclick="zap(15970)">
      <span>👑 Ultimate Fibonacci</span>
      <span class="text-amber-300 font-bold">15,970 sats</span>
    </button>

  </div>

</div>

<!-- FACEBOOK FEED (FULL WIDTH + CENTERED) -->
<div class="fb-wrap mb-16">
  <div class="fb-inner text-center">

    <h2 class="text-2xl font-light mb-6 text-amber-300">
      Live Art Pipeline Feed
    </h2>

    <div id="fb-root"></div>

    <div class="fb-page"
      data-href="https://www.facebook.com/covellz/"
      data-tabs="timeline"
      data-width="1000"
      data-height="800"
      data-small-header="false"
      data-adapt-container-width="true"
      data-hide-cover="false"
      data-show-facepile="true">
    </div>

  </div>
</div>

<script>
const LN_ADDRESS = "silverlenz@rizful.com";

/* -----------------------
   ZAP SYSTEM
------------------------*/
async function zap(sats) {
  const card = document.getElementById("card");

  try {
    setStatus("Preparing zap ⚡...");

    const msats = sats * 1000;
    const [name, domain] = LN_ADDRESS.split("@");
    const lnurl = `https://${domain}/.well-known/lnurlp/${name}`;

    const res = await fetch(lnurl);
    const data = await res.json();

    const invoiceRes = await fetch(`${data.callback}?amount=${msats}`);
    const invoice = await invoiceRes.json();

    if (!invoice.pr) throw new Error("No invoice");

    setStatus("Opening wallet...");

    if (window.webln) {
      await window.webln.enable();
      await window.webln.sendPayment(invoice.pr);
      successFX(card);
      return;
    }

    window.location.href = `lightning:${invoice.pr}`;
    successFX(card);

  } catch (e) {
    console.error(e);
    setStatus("Zap failed ⚠️");
  }
}

/* -----------------------
   SUCCESS FX
------------------------*/
function successFX(el) {
  setStatus("⚡ Zap sent successfully!");

  el.classList.add("success-glow");
  setTimeout(() => el.classList.remove("success-glow"), 700);

  confetti({ particleCount: 120, spread: 70, origin: { y: 0.6 } });

  setTimeout(() => {
    confetti({ particleCount: 60, spread: 50, origin: { x: 0 } });
  }, 200);

  setTimeout(() => setStatus("Ready to receive zaps ⚡"), 2500);
}

/* -----------------------
   STATUS
------------------------*/
function setStatus(msg) {
  document.getElementById("status").innerText = msg;
}

/* -----------------------
   COPY
------------------------*/
function copyAddress() {
  navigator.clipboard.writeText(LN_ADDRESS);
  setStatus("Address copied ✔");
  setTimeout(() => setStatus("Ready to receive zaps ⚡"), 2000);
}

/* -----------------------
   FACEBOOK SDK
------------------------*/
!(function(d,s,id){
  var js,fjs=d.getElementsByTagName(s)[0];
  if(d.getElementById(id))return;
  js=d.createElement(s);js.id=id;
  js.src="https://connect.facebook.net/en_US/sdk.js#xfbml=1&version=v18.0";
  fjs.parentNode.insertBefore(js,fjs);
}(document,'script','facebook-jssdk'));

</script>

</body>
</html>
