<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SilverLenz ⚡ Living Zap Art</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

<style>
body {
  margin: 0;
  font-family: system-ui, sans-serif;
  background: radial-gradient(circle at top, #111 0%, #000 100%);
  color: #f1f1f1;
  overflow-x: hidden;
}

/* ----------------------------
   BACKGROUND ENERGY LAYER
-----------------------------*/
#bgGlow {
  position: fixed;
  inset: 0;
  z-index: -1;
  background: radial-gradient(circle at 50% 30%, rgba(251,191,36,0.08), transparent 60%);
  transition: 0.6s ease;
}

/* ----------------------------
   ZAP BUTTONS
-----------------------------*/
.zap-btn {
  border: 2px solid rgba(251,191,36,0.15);
  transition: all 0.25s ease;
  position: relative;
  overflow: hidden;
}

.zap-btn:hover {
  transform: translateY(-2px);
  border-color: rgba(251,191,36,0.5);
}

/* tier glow */
.low { box-shadow: 0 0 10px rgba(251,191,36,0.08); }
.mid { box-shadow: 0 0 18px rgba(251,191,36,0.15); }
.high { box-shadow: 0 0 28px rgba(251,191,36,0.25); }
.legend {
  box-shadow: 0 0 50px rgba(251,191,36,0.45);
  animation: breathe 2.4s ease-in-out infinite;
}

@keyframes breathe {
  0%,100% { transform: scale(1); }
  50% { transform: scale(1.01); }
}

/* zap pulse */
.flash {
  animation: flash 0.6s ease;
}
@keyframes flash {
  0% { box-shadow: 0 0 0 rgba(251,191,36,0); }
  50% { box-shadow: 0 0 40px rgba(251,191,36,0.5); }
  100% { box-shadow: 0 0 0 rgba(251,191,36,0); }
}

/* LIVE TICKER */
#ticker {
  position: fixed;
  bottom: 12px;
  left: 12px;
  font-size: 12px;
  opacity: 0.7;
}

/* QR */
#qrModal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  align-items: center;
  justify-content: center;
}
</style>
</head>

<body>

<div id="bgGlow"></div>

<!-- HEADER -->
<div class="text-center mt-10 mb-6">
  <h1 class="text-4xl font-light tracking-widest">SILVERLENZ</h1>
  <p class="text-amber-300 text-sm">Living Lightning Art Economy ⚡</p>
  <div id="weblnStatus" class="text-xs mt-2 opacity-60"></div>
</div>

<!-- ZAP ADDRESS -->
<div class="max-w-xl mx-auto bg-zinc-900/80 p-5 rounded-2xl border border-amber-400/20 text-center mb-6">
  <div class="text-amber-400">silverlenz@rizful.com</div>
</div>

<!-- ZAP BUTTONS -->
<div class="max-w-xl mx-auto space-y-3 mb-20">

<button class="zap-btn low w-full flex justify-between p-4 rounded-xl bg-zinc-800"
onclick="zap(1440,this)">
<span>Perfect Harmony</span><span class="text-amber-300 font-bold">1,440</span>
</button>

<button class="zap-btn mid w-full flex justify-between p-4 rounded-xl bg-zinc-800"
onclick="zap(2330,this)">
<span>Artistic Flow</span><span class="text-amber-300 font-bold">2,330</span>
</button>

<button class="zap-btn mid w-full flex justify-between p-4 rounded-xl bg-zinc-800"
onclick="zap(3770,this)">
<span>Divine Proportion</span><span class="text-amber-300 font-bold">3,770</span>
</button>

<button class="zap-btn high w-full flex justify-between p-4 rounded-xl bg-zinc-800"
onclick="zap(6100,this)">
<span>Spiral Energy</span><span class="text-amber-300 font-bold">6,100</span>
</button>

<button class="zap-btn high w-full flex justify-between p-4 rounded-xl bg-zinc-800"
onclick="zap(9870,this)">
<span>Golden Spiral</span><span class="text-amber-300 font-bold">9,870</span>
</button>

<button class="zap-btn legend w-full flex justify-between p-4 rounded-xl bg-zinc-800"
onclick="zap(15970,this)">
<span>Ultimate Fibonacci</span><span class="text-amber-300 font-bold">15,970</span>
</button>

</div>

<!-- LIVE ZAP TICKER -->
<div id="ticker">⚡ waiting for zaps...</div>

<!-- QR MODAL -->
<div id="qrModal">
  <div style="background:#111;padding:20px;border-radius:12px;text-align:center">
    <div id="qr"></div>
    <button onclick="closeQR()" style="margin-top:10px">Close</button>
  </div>
</div>

<script>
const LN = "silverlenz@rizful.com";
let heat = 0;

/* -------------------------
   WEBSOCKET SIM (LIVE FEEL)
--------------------------*/
function pushZap(amount){
  const ticker = document.getElementById("ticker");
  ticker.innerText = `⚡ incoming zap: ${amount} sats`;
}

/* -------------------------
   ZAP SYSTEM
--------------------------*/
async function zap(sats, btn){
  try {
    heat += sats;
    updateBackground();

    pushZap(sats);

    const msats = sats * 1000;
    const [name, domain] = LN.split("@");

    const lnurl = `https://${domain}/.well-known/lnurlp/${name}`;
    const res = await fetch(lnurl);
    const data = await res.json();

    const inv = await fetch(`${data.callback}?amount=${msats}`);
    const invoice = await inv.json();

    const pr = invoice.pr;

    // attempt wallet
    const a = document.createElement("a");
    a.href = "lightning:" + pr;
    document.body.appendChild(a);
    a.click();
    a.remove();

    setTimeout(()=>showQR(pr),1200);

    success(btn);

  } catch(e){
    console.log(e);
  }
}

/* -------------------------
   SUCCESS FX
--------------------------*/
function success(btn){
  btn.classList.add("flash");
  setTimeout(()=>btn.classList.remove("flash"),600);

  confetti({ particleCount: 80, spread: 60 });

  setTimeout(()=>{
    confetti({ particleCount: 40, spread: 40 });
  },150);
}

/* -------------------------
   BACKGROUND ENERGY
--------------------------*/
function updateBackground(){
  const glow = document.getElementById("bgGlow");

  const intensity = Math.min(heat / 20000, 1);

  glow.style.background =
    `radial-gradient(circle at 50% 30%,
     rgba(251,191,36,${0.05 + intensity*0.25}),
     transparent 60%)`;
}

/* -------------------------
   QR FALLBACK
--------------------------*/
function showQR(pr){
  document.getElementById("qrModal").style.display="flex";
  document.getElementById("qr").innerHTML="";
  new QRCode(document.getElementById("qr"), {
    text: pr,
    width: 200,
    height: 200
  });
}

function closeQR(){
  document.getElementById("qrModal").style.display="none";
}

/* -------------------------
   WEBSOCKET DETECTION
--------------------------*/
window.onload = async ()=>{
  if(window.webln){
    document.getElementById("weblnStatus").innerText = "⚡ Alby WebLN detected";
  } else {
    document.getElementById("weblnStatus").innerText = "QR fallback mode ready";
  }
};
</script>

</body>
</html>
