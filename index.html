<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zaps ⚡ | Support SilverLenz Art Pipeline</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/nostr-zap@latest"></script>
  <style>
    body { background: #0a0a0a; color: #f1f1f1; font-family: system-ui, sans-serif; }
    .nostr-embed-container { max-width: 100%; margin: 0 auto; }
    .preset-row { 
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); 
    }
    .preset-row:hover { 
      transform: translateY(-3px); 
      box-shadow: 0 15px 25px -5px rgb(245 158 11 / 0.3); 
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center p-6 md:p-12">
  <div class="max-w-3xl w-full">

    <!-- Header with Logo -->
    <div class="flex items-center gap-5 mb-10 justify-center">
      <img src="https://raw.githubusercontent.com/SilverLenZ/zack-zaps/main/silverlenz%20logo.jpg" 
           alt="SilverLenz" 
           class="w-20 h-20 rounded-2xl object-cover border border-amber-400/50">
      <div>
        <h1 class="text-5xl font-light tracking-widest">ZACK COVELL</h1>
        <p class="text-amber-300 text-xl -mt-1">SilverLenz • Fibonacci Art Pipeline</p>
      </div>
    </div>

    <h2 class="text-center text-4xl font-light mb-4 tracking-wider">ZAPS THAT RESONATE ⚡</h2>
    <p class="text-center text-amber-300 mb-12 text-lg">Support the daily art pipeline</p>

    <!-- Zap Presets -->
    <div class="mb-16">
      <h3 class="text-3xl font-light text-center mb-8">Choose Your Resonance</h3>
      <div class="space-y-5" id="presets"></div>
    </div>

    <!-- Cleaner Nostr Embed -->
    <div class="bg-zinc-900 rounded-3xl overflow-hidden shadow-2xl p-4">
      <div id="nostr-embed" class="nostr-embed-container"></div>
    </div>

    <footer class="text-center text-xs opacity-60 mt-12">
      Powered by Nostr • Thank you for resonating with the work
    </footer>
  </div>

  <script>
    const npub = "npub1qc87690ur36nn5td80c07adf72s0evw6fen60l5ytghgp44awljsxml2ka";

    function renderPresets() {
      const presetsHTML = `
        <button data-npub="${npub}" class="preset-row w-full flex items-center gap-6 bg-zinc-800 hover:bg-amber-900/70 rounded-3xl p-7 text-left text-xl">
          👍 <span class="text-4xl font-bold">144</span><span class="flex-1">Perfect Harmony ♫</span>
        </button>
        <button data-npub="${npub}" class="preset-row w-full flex items-center gap-6 bg-zinc-800 hover:bg-amber-900/70 rounded-3xl p-7 text-left text-xl">
          🚀 <span class="text-4xl font-bold">233</span><span class="flex-1">Artistic Flow 🌀</span>
        </button>
        <button data-npub="${npub}" class="preset-row w-full flex items-center gap-6 bg-zinc-800 hover:bg-amber-900/70 rounded-3xl p-7 text-left text-xl">
          ☕ <span class="text-4xl font-bold">377</span><span class="flex-1">Divine Proportion △</span>
        </button>
        <button data-npub="${npub}" class="preset-row w-full flex items-center gap-6 bg-zinc-800 hover:bg-amber-900/70 rounded-3xl p-7 text-left text-xl">
          ✨ <span class="text-4xl font-bold">610</span><span class="flex-1">Spiral Energy 🌀</span>
        </button>
        <button data-npub="${npub}" class="preset-row w-full flex items-center gap-6 bg-zinc-800 hover:bg-amber-900/70 rounded-3xl p-7 text-left text-xl">
          🍷 <span class="text-4xl font-bold">987</span><span class="flex-1">Golden Spiral ✨</span>
        </button>
        <button data-npub="${npub}" class="preset-row w-full flex items-center gap-6 bg-zinc-800 hover:bg-amber-900/70 rounded-3xl p-7 text-left text-xl">
          👑 <span class="text-4xl font-bold">1597</span><span class="flex-1">Ultimate Fibonacci ✨</span>
        </button>
      `;
      document.getElementById('presets').innerHTML = presetsHTML;
    }

    // Load nostr-embed
    !(function () {
      const n = document.createElement('script');
      n.type = 'text/javascript';
      n.async = true;
      n.src = 'https://cdn.jsdelivr.net/gh/nostrband/nostr-embed@latest/dist/nostr-embed.js';
      n.onload = function () {
        nostrEmbed.init(
          "nevent1qvzqqqqqqypzqps0a52lc8r488gk6wlsla66nu4qljca5nn85llggk3wsrtt6al9qqsy209tvjpkg55syad7xa5rykhxy93faxkzu2m9de0jharkst745vgqpjjnn",
          "#nostr-embed",
          "wss://relay.primal.net"
        );
      };
      const a = document.getElementsByTagName('script')[0];
      a.parentNode.insertBefore(n, a);
    })();

    window.onload = renderPresets;
  </script>
</body>
</html>
