<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SilverLenz ⚡ Nostr Zap Gallery</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body { background:#0a0a0a; color:#f1f1f1; font-family:system-ui; }
    .card { transition:0.2s; }
    .card:hover { transform: translateY(-2px); }
  </style>
</head>

<body class="p-6 md:p-12 flex justify-center">
  <div class="max-w-4xl w-full">

    <!-- Header -->
    <div class="text-center mb-10">
      <h1 class="text-5xl font-light tracking-widest">SILVERLENZ</h1>
      <p class="text-amber-300 mt-2">Nostr Art + Lightning Zaps ⚡</p>
      <p class="text-xs opacity-60 mt-2">Lightning: silverlenz@rizful.com</p>
    </div>

    <!-- Feed -->
    <div id="feed" class="space-y-6"></div>

  </div>

<script>
const LN_ADDRESS = "silverlenz@rizful.com";

/**
 * Your "Nostr posts" (static demo feed)
 * In real Nostr: these are kind 1 events from relays
 */
const posts = [
  {
    id: "art-001",
    title: "Perfect Harmony",
    sats: 1440,
    emoji: "🎼"
  },
  {
    id: "art-002",
    title: "Artistic Flow",
    sats: 2330,
    emoji: "🌀"
  },
  {
    id: "art-003",
    title: "Golden Spiral",
    sats: 9870,
    emoji: "✨"
  }
];

function renderFeed() {
  document.getElementById("feed").innerHTML = posts.map(p => `
    <div class="card bg-zinc-900 border border-amber-400/20 rounded-3xl p-6">

      <div class="flex justify-between items-center">
        <div>
          <h2 class="text-2xl font-light">${p.emoji} ${p.title}</h2>
          <p class="text-xs text-amber-300 mt-1">Post ID: ${p.id}</p>
        </div>

        <button onclick="zap('${p.id}', ${p.sats})"
                class="bg-amber-600 hover:bg-amber-500 px-5 py-3 rounded-2xl">
          ⚡ Zap ${p.sats}
        </button>
      </div>

    </div>
  `).join("");
}

/**
 * REAL zap flow:
 * - resolves LNURL
 * - fetches invoice
 * - optionally includes Nostr metadata hook (future relay support)
 */
async function zap(postId, sats) {
  try {
    const msats = sats * 1000;

    // 1. LNURL resolve
    const [name, domain] = LN_ADDRESS.split("@");
    const lnurl = `https://${domain}/.well-known/lnurlp/${name}`;

    const res = await fetch(lnurl);
    const data = await res.json();

    // 2. invoice
    const invoiceRes = await fetch(`${data.callback}?amount=${msats}`);
    const invoice = await invoiceRes.json();

    if (!invoice.pr) {
      alert("Invoice failed");
      return;
    }

    // 3. WebLN (best UX)
    if (window.webln) {
      await window.webln.enable();
      await window.webln.sendPayment(invoice.pr);
      return;
    }

    // 4. fallback
    window.location.href = `lightning:${invoice.pr}`;

    console.log("Zap context (Nostr-ready):", {
      event: postId,
      sats,
      type: "nostr-zap-ready"
    });

  } catch (e) {
    console.error(e);
    alert("Zap failed");
  }
}

renderFeed();
</script>

</body>
</html>
